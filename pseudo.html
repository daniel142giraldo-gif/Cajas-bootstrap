<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Responsivo</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .caja1 {
            height: 100px;
            background-color: #2D3F54;
        }

        .caja2 {
            height: 300px;
            background-color: #52647A;
        }

        .caja3 {
            height: 300px;
            background-color: #73CC80;
        }

        .caja4 {
            height: 300px;
            background-color: #004C94;
        }

        .caja5 {
            height: 300px;
            background-color: #006ECF;
        }

        .caja6 {
            height: 300px;
            background-color: #3C93FA;
        }

        .caja7 {
            height: 300px;
            background-color: #00D4C6;
        }

        .caja8 {
            height: 300px;
            background-color: #0FA69D;
        }

        .caja9 {
            height: 300px;
            background-color: #028183;
        }

        .caja10 {
            height: 300px;
            background-color: #2D3F54;
        }

        .caja11 {
            height: 300px;
            background-color: #1a252f;
        }

        /* Estilo base para texto centrado */
        .caja {
            color: white;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>

<body>
    <div class="container-fluid p-2">
        <div class="row g-2">

            <!-- BLOQUE 1: 4 Cajas arriba (Web: 4 de ancho 3) -->
            <div class="col-12 col-md-6 col-lg-3 caja caja1">caja1</div>
            <div class="col-12 col-md-6 col-lg-3 caja caja2">caja2</div>
            <div class="col-12 col-md-6 col-lg-3 caja caja3">caja3</div>
            <div class="col-12 col-md-6 col-lg-3 caja caja4">caja4</div>

            <!-- BLOQUE 2: 1 Caja sola (Web: 1 de ancho 12) -->
            <div class="col-12 col-lg-12 caja caja5">caja5</div>

            <!-- BLOQUE 3: 2 Cajas (Web: 2 de ancho 6) -->
            <div class="col-12 col-md-6 col-lg-6 caja caja6">caja6</div>
            <div class="col-12 col-md-6 col-lg-6 caja caja7">caja7</div>

            <!-- BLOQUE 4: Primera línea de 6 cajas (Web: 6 de ancho 2) -->
            <div class="col-6 col-md-4 col-lg-2 caja caja8">caja8</div>
            <div class="col-6 col-md-4 col-lg-2 caja caja9">caja9</div>
            <div class="col-6 col-md-4 col-lg-2 caja caja10">caja10</div>
            <div class="col-6 col-md-4 col-lg-2 caja caja11">caja11</div>
            <div class="col-6 col-md-4 col-lg-2 caja caja8">caja12</div>
            <div class="col-6 col-md-4 col-lg-2 caja caja9">caja13</div>

            <!-- BLOQUE 5: Segunda línea de 6 cajas (Web: 6 de ancho 2) -->
            <div class="col-6 col-md-4 col-lg-2 caja caja10">caja14</div>
            <div class="col-6 col-md-4 col-lg-2 caja caja11">caja15</div>
            <div class="col-6 col-md-4 col-lg-2 caja caja8">caja16</div>
            <div class="col-6 col-md-4 col-lg-2 caja caja9">caja17</div>
            <div class="col-6 col-md-4 col-lg-2 caja caja10">caja18</div>
            <div class="col-6 col-md-4 col-lg-2 caja caja11">caja19</div>

            <!-- BLOQUE 6: Tercera línea de 6 cajas (Web: 6 de ancho 2) -->
            <div class="col-6 col-md-4 col-lg-2 caja caja8">caja20</div>
            <div class="col-6 col-md-4 col-lg-2 caja caja9">caja21</div>
            <div class="col-6 col-md-4 col-lg-2 caja caja10">caja22</div>
            <div class="col-6 col-md-4 col-lg-2 caja caja11">caja23</div>
            <div class="col-6 col-md-4 col-lg-2 caja caja8">caja24</div>
            <div class="col-6 col-md-4 col-lg-2 caja caja9">caja25</div>

        </div>
    </div>
</body>

</html>
